<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Animl Export Demo</title>
<style>
  body { margin:0; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; background:#000; font-family:sans-serif; gap:16px; }
  #stage { width:800px; max-width:95vw; }
  button { padding:10px 20px; font-size:16px; cursor:pointer; }
</style>
</head>
<body>
<div id="stage"></div>
<button id="recordBtn">Record & Download WebM</button>
<script src="../animl.js"></script>
<script>
const scene = new Animl.Scene("#stage", { width:800, height:500, background:"#0d1117", renderer:"canvas" });

const circle = new Animl.Circle({ x:-250, y:0, radius:40, fill:"#4f8fff" });
const square = new Animl.Rect({ x:250, y:0, width:80, height:80, fill:"#ff6b6b" });
scene.add(circle);
scene.add(square);

async function playScene(){
  await scene.play(
    Animl.anim.create(circle, { duration:0.8 }),
    Animl.anim.create(square, { duration:0.8, delay:0.2 })
  );
  await scene.play(
    Animl.anim.moveTo(circle, 0, 100, { duration:1.2 }),
    Animl.anim.moveTo(square, 0, -100, { duration:1.2 }),
    Animl.anim.rotateTo(square, 180, { duration:1.2 })
  );
  await scene.play(
    Animl.anim.colorTo(circle, "#f7b731", { duration:1 }),
    Animl.anim.scaleTo(square, 1.5, { duration:1 })
  );
}

document.getElementById("recordBtn").addEventListener("click", async () => {
  circle.set({ x:-250, y:0, opacity:0, fill:"#4f8fff" });
  square.set({ x:250, y:0, opacity:0, rotation:0, scale:1, fill:"#ff6b6b" });
  const recorder = scene.record({ fps:30, filename:"animl-scene" });
  await playScene();
  recorder.stop();
});

playScene();
</script>
</body>
</html>
