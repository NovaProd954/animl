<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Animl SVG Import + Camera Demo</title>
<style>
  body { margin:0; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; background:#000; gap:12px; }
  #stage { width:800px; max-width:95vw; }
  p { color:#888; font-family:sans-serif; font-size:14px; }
</style>
</head>
<body>
<div id="stage"></div>
<p>Scripted camera move — no dragging needed for this one</p>
<script src="../animl.js"></script>
<script>
const scene2d = new Animl.Scene("#stage", { width:800, height:250, background:"#0d1117" });

const starPath = `<svg xmlns="http://www.w3.org/2000/svg">
  <path d="M 0 -60 L 15 -20 L 58 -20 L 24 5 L 36 48 L 0 22 L -36 48 L -24 5 L -58 -20 L -15 -20 Z"/>
</svg>`;
const importedStar = Animl.SVGMobject(starPath, { fill:"#f7b731" });
importedStar.set({ x:-250, y:0 });
scene2d.add(importedStar);

const label = new Animl.Txt({ x:-250, y:90, text:"imported via SVGMobject", fontSize:16, fill:"#888" });
scene2d.add(label);
scene2d.add(Animl.shapes.underline(label, { gap:4 }));

const a = new Animl.Circle({ x:50, y:0, radius:25, fill:"#4f8fff" });
const bEl = new Animl.Circle({ x:200, y:0, radius:25, fill:"#ff6b6b" });
scene2d.add(a); scene2d.add(bEl);
scene2d.add(Animl.shapes.brace(50, 30, 200, 30, { color:"#e6edf3" }));
scene2d.add(Animl.shapes.doubleArrow(50, -40, 200, -40, { color:"#2ecc71" }));

async function run2d(){
  await scene2d.play(Animl.anim.create(importedStar, { duration:0.8 }), Animl.anim.spin(importedStar, 1, { duration:1.2 }));
}
run2d();

const stage3d = document.createElement("div");
stage3d.id = "stage3d";
stage3d.style.width = "800px"; stage3d.style.maxWidth = "95vw";
document.body.insertBefore(stage3d, document.querySelector("p"));

const scene3d = new Animl.Scene3D("#stage3d", { width:800, height:400, background:"#0d1117", cameraDistance:8 });
const cube = new Animl.Cube({ size:1.5, fill:"#4f8fff" });
const sphere = new Animl.Sphere({ x:2.5, radius:0.8, segments:20, fill:"#ff6b6b" });
scene3d.add(cube); scene3d.add(sphere);

async function run3d(){
  await scene3d.wait(0.5);
  await scene3d.moveCamera({ azimuth: Math.PI*1.3, elevation: 0.9 }, { duration:3, easing:"smooth" });
  await scene3d.moveCamera({ radius: 4 }, { duration:1.5, easing:"easeOut" });
  await scene3d.moveCamera({ azimuth: 0.6, elevation: 0.5, radius: 8 }, { duration:2.5, easing:"smooth" });
}
run3d();
</script>
</body>
</html>
